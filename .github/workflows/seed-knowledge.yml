# 正本（knowledge_base/）を S3 に同期し、KB に取り込む。
#
# architecture_v1.md §5.2 の「人 → Git（PR レビュー）→ マージ → CI が S3 に sync
# → KB の Ingestion」の CI 側。手で流すときと**同じ** code/scripts/seed_knowledge.py
# をそのまま実行する（CI 用の別経路は作らない）。
#
# PR では AWS に触らず front matter の検証だけ。main にマージされて初めて S3 に出る。
# 「Git が正本、S3 は配信先」という向きはここでも変えない。
#
# 事前に必要なもの:
#   - KaiKnowledgeStack の deploy（出力 SeedKnowledgeRoleArn）
#   - リポジトリの Secret AWS_SEED_ROLE_ARN にその ARN を設定

name: seed-knowledge

on:
  pull_request:
    paths:
      - "knowledge_base/**"
      - "code/tools/core.py"
      - "code/scripts/seed_knowledge.py"
      - "code/scripts/validate_knowledge.py"
      - "code/scripts/check_retrieve.py"
      # validate が pytest を回すので、テストと依存の変更でも起動させる
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/seed-knowledge.yml"
  push:
    branches: [main]
    paths:
      - "knowledge_base/**"
      - "code/tools/core.py"
      - "code/scripts/seed_knowledge.py"
      - "code/scripts/validate_knowledge.py"
      - "code/scripts/check_retrieve.py"
      # validate が pytest を回すので、テストと依存の変更でも起動させる
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/seed-knowledge.yml"
  # 正本を触らない変更で索引だけ作り直したいとき用。
  # OIDC の sub を main に固定してあるので、main から実行すること
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ingestion job は同一データソースで並行実行できない。
  # 連続 push を潰さずに順番待ちさせる（cancel-in-progress: false）
  group: seed-knowledge
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  validate:
    name: front matter と単体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv は v8 以降**メジャータグを公開しない**（`@v9` は解決できない）。
      # tj-actions の供給網攻撃を受けての方針で、代わりに全リリースが immutable。
      # 上げるときは完全バージョンで指定すること
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --extra dev

      - name: 単体テスト
        run: uv run pytest

      - name: 正本の規約検証
        # 1 ファイルだけを見ていては分からない検査（doc_id の一意性・supersedes の
        # 対称性・ファイル名との一致・置き場所と型の一致）。**別リポジトリの正本
        # （kai-knowledge）もこれを --root で呼ぶ**ので、規約は1か所で持つ
        run: uv run python code/scripts/validate_knowledge.py

      - name: front matter の検証
        # --dry-run は collect() だけを回す＝AWS の認証情報が要らない。
        # 壊れた Markdown はここで落ちて S3 には出ない。
        # フォークからの PR でも安全に走るのはこのため。
        # 上の規約検証と重なる部分はあるが、こちらは **.metadata.json の生成まで**
        # 通すので、S3 に出る形そのものを確かめている
        run: uv run python code/scripts/seed_knowledge.py --dry-run

  sync:
    name: S3 へ同期して KB に取り込む
    needs: validate
    # PR では同期しない。main への push と、main からの手動実行だけ
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # OIDC のトークン発行にこれが要る。job 単位で付けて validate には渡さない
      id-token: write
      contents: read
    steps:
      # seed_knowledge.py は「ローカルに無いキーを S3 から消す」ので、
      # sparse checkout や部分取得にしないこと（消えてはいけないものが消える）
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync

      # v6 で Node 24 になった。v5 の破壊的変更（不正な boolean 入力の扱い）は
      # 文字列しか渡していないので関係ない
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_SEED_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 同期と Ingestion
        # run_ingestion() の待ちループに上限が無いので、ここで頭を押さえる
        timeout-minutes: 20
        run: uv run python code/scripts/seed_knowledge.py

      # Ingestion が COMPLETE でも「引けるか」は別。取り込みの成否しか見ないと、
      # `.metadata.json` の設計ミスやチャンクの割れ方で引き当てが落ちても気づけない。
      # **エージェントもツールも通さない**ので、ここが落ちたら索引側の問題だと分かる
      - name: 引き当ての検証
        timeout-minutes: 5
        run: uv run python code/scripts/check_retrieve.py --show
