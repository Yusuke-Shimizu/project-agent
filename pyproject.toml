[project]
name = "project-agent"
version = "0.1.0"
description = "v1 Project Context Agent - 案件の decision / knowledge を根拠付きで引くエージェント"
requires-python = ">=3.12"
# AgentCore Runtime のコンテナ（CodeZip）は **この dependencies だけ**を見る。
# requirements.txt も optional-dependencies も読まれないので、Runtime で要るものは
# 全部ここに置く（§10-14）。
dependencies = [
    "strands-agents>=1.50.2",
    "boto3>=1.35.0",
    "pyyaml>=6.0",
    # BedrockAgentCoreApp（/invocations・/ping・HealthyBusy）
    "bedrock-agentcore>=1.19.0",
    # トレースを CloudWatch GenAI Observability に流す（§4.6）
    "aws-opentelemetry-distro>=0.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# CDK は infrastructure/ でしか使わないので本体の依存には入れない
infra = ["aws-cdk-lib>=2.150.0", "constructs>=10.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# code/ はソースルート。パッケージは tools / runtime。
# code/ 自体をパッケージにしないのは、標準ライブラリの `code` モジュールを隠さないため。
[tool.hatch.build.targets.wheel]
packages = ["code/tools", "code/runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
